name: Update Showdown Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-data:
    name: Update Datasets from smogon/pokemon-showdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout smogon/pokemon-showdown
        uses: actions/checkout@v7
        with:
          repository: smogon/pokemon-showdown
          path: smogon-showdown
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run dataset updater from smogon/pokemon-showdown
        run: go run ./cmd/updater -showdown-dir ./smogon-showdown

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Update Showdown data from smogon/pokemon-showdown"
          title: "Automatic Showdown Data Update"
          body: "Automated update of battle datasets fetched directly from smogon/pokemon-showdown."
          branch: automation/update-data
          delete-branch: true
