name: Bug Report
description: Create a report to help us improve GhostHaze-Thinker
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Start bot with '...'
        2. Execute command '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Output
      description: Please paste any relevant console logs or output (redact any sensitive passwords or tokens).
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, Go version, or Docker version.
      placeholder: Ubuntu 24.04 / Go 1.24 / Docker
    validations:
      required: false
